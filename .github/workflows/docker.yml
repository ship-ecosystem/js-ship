name: Docker integration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'templates/**'
      - 'images/**'
      - 'test/**'
      - 'scripts/**'
      - 'examples/**'
      - 'package*.json'
      - '.github/workflows/docker.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [catalog, browser-services, switch-manager, doctor, workspace-ssr, external-services, extensions, runtime-policy, workspaces, build-environment, workflow, static, mongodb, dependencies, next, vite, servers, ssr, angular, gatsby, tanstack, lifecycle]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify Docker and Compose
        run: |
          docker version
          docker compose version
      - name: Run isolated Docker suite
        timeout-minutes: 22
        shell: bash
        env:
          # Keep the disposable Elasticsearch node independent of the runner's disk watermark.
          SHIP_TEST_LOW_DISK_ELASTIC: '1'
        run: node --test test/docker/${{ matrix.suite }}.test.mjs 2>&1 | tee docker-test.log
      - name: Show test output
        if: always()
        run: cat docker-test.log
      - name: Retain test output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-${{ matrix.suite }}-output
          path: docker-test.log
          retention-days: 7

  browser:
    name: Chromium HMR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Install headless Chromium and dependencies
        run: npx playwright install --with-deps --only-shell chromium
      # Docker veth IPv6 address changes can abort Chromium's IPv4 loopback requests.
      # This disposable runner's fixtures exercise 127.0.0.1, not IPv6 coverage.
      - name: Keep new browser fixture interfaces IPv4-only
        run: sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
      - name: Run browser HMR checks
        timeout-minutes: 18
        shell: bash
        run: npm run test:browser 2>&1 | tee browser-test.log
      - name: Show browser output
        if: always()
        run: if [ -f browser-test.log ]; then cat browser-test.log; fi
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-hmr-output
          path: |
            browser-test.log
            test-results/
          retention-days: 7
